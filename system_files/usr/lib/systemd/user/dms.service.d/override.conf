[Service]
# DMS's own screenshot action writes a file and stops there unless this is
# set; with it, DMS runs `swappy -f <path>` on the capture (the value is
# special-cased in its NiriService.qml alongside satty, so no wrapper is
# needed). zirconium points this at satty, which would mean adding the Terra
# repo for one package when swappy is already on the image for the
# grim/slurp annotate keybind.
Environment=DMS_SCREENSHOT_EDITOR=swappy
